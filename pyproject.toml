[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-ledger"
version = "0.1.0"
description = "A local evidence-bound project handoff workflow"
requires-python = ">=3.11"
dependencies = ["openminion==0.1.16", "pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]
